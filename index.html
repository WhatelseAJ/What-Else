<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Else? — Movie & Actor Match Finder</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1 class="title">🎬 What Else?</h1>
    <p class="subtitle">Discover how your favorite actors or films connect.</p>
  </header>

  <main class="container">
    <section class="controls" aria-label="Search Settings">
      <div class="mode-selection">
        <label for="modeSelect" class="sr-only">Choose Comparison Mode</label>
        <select id="modeSelect">
          <option value="actors">Compare Actors</option>
          <option value="films">Compare Films</option>
        </select>
      </div>

      <div class="btn-group" role="group" aria-label="Action Buttons">
        <button id="searchBtn" class="btn-red" title="Find connections">🔍 Search</button>
        <button id="shuffleBtn" class="btn-blue" title="Try a random pair">🎲 Shuffle</button>
        <button id="addBtn" class="btn-green" title="Add another search field">➕ Add</button>
        <button id="clearBtn" class="btn-orange" title="Clear everything">🧹 Clear</button>
      </div>
    </section>

    <div id="inputSection" class="input-section" aria-live="polite"></div>

    <div id="comparisonHeader" aria-hidden="true"></div>

    <section id="results" class="results-section" aria-live="polite">
      </section>
  </main>

  <footer class="site-footer">
    <p><em>Everything is figureoutable.</em></p>
    <p>Powered by <strong>TMDb</strong> • Built under the watchful eyes of Barb ❤️</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
